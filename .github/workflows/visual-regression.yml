name: Visual Regression

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run visual regression tests
        run: bun run test:visual

      - name: Verify upgrade and compatibility on Komari 1.6.2
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 1.6.2 --repo komari-monitor/komari --pattern komari-linux-amd64 --output "$RUNNER_TEMP/komari-1.6.2"
          gh release download v1.0.11 --repo schmidttt/komari-glassops --pattern '*-build-*.zip' --output "$RUNNER_TEMP/glassops-v1.0.11.zip"
          chmod +x "$RUNNER_TEMP/komari-1.6.2"
          node scripts/verify-komari-admin.mjs "$RUNNER_TEMP/komari-1.6.2" 1.6.2 "$RUNNER_TEMP/glassops-v1.0.11.zip"

      - name: Upload comparison screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: network-comparison
          path: |
            test-results/artifacts/**/network-comparison-*.png
            test-results/live-admin/1.6.2/comparison.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload visual differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-diffs
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
